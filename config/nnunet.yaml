# nnU-Net Phase 0 / Phase 1 configuration (strong-model comparator)
# See: docs/training/nnunet_phase0.md, docs/training/weak_vs_strong_model_plan.md

dataset_id: 501
dataset_name: BHSD
# Full folder name: Dataset501_BHSD

# Source BHSD paths (relative to project root)
images_dir: data/raw/label_192/images
labels_dir: data/raw/label_192/ground truths
splits_csv: data/metadata/splits.csv

# nnU-Net raw output (gitignored; regenerated by conversion script)
nnunet_raw_root: data/nnunet/nnUNet_raw
# Preprocessed / results roots (Kaggle will override via env vars)
nnunet_preprocessed_root: data/nnunet/nnUNet_preprocessed
nnunet_results_root: data/nnunet/nnUNet_results

# Versioned locked split for fold 0 (train/val only; test held out)
splits_final_json: data/metadata/nnunet_splits_final.json

# Classes (must match project label map)
labels:
  background: 0
  EDH: 1
  SDH: 2
  SAH: 3
  IPH: 4
  IVH: 5

channel_names:
  "0": CT

file_ending: .nii.gz  # auto-overridden at convert time if source volumes are .nii

# Training policy for Kaggle (documented; applied in notebook)
configuration: 3d_fullres
fold: 0
# Time-cap: prefer trainer with frequent checkpoints; resume on Run #2 if needed
kaggle_max_hours: 12
copy_checkpoints_every_epochs: 10
