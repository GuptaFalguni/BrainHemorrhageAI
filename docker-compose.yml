# BrainHemorrhageAI — API + SPA
# Research Software — Not for Clinical Use
#
# Usage:
#   docker compose up --build
#   Open http://localhost:3000
#
# First API start downloads model weights (~0.7 GB) from GitHub Release
# unless ./checkpoints is mounted with the required files.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      WEIGHTS_URL: ${WEIGHTS_URL:-https://github.com/GuptaFalguni/BrainHemorrhageAI/releases/download/v1.0.0/model-weights-v1.tar.gz}
    volumes:
      - checkpoints_data:/app/checkpoints
      - api_reports:/app/reports/api_v1
    # Optional local override (uncomment if you already have weights on disk):
    # volumes:
    #   - ./checkpoints:/app/checkpoints
    #   - api_reports:/app/reports/api_v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  checkpoints_data:
  api_reports:
