[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-hemorrhage-ai"
version = "1.1.0"
description = "Research demo: multi-class brain CT hemorrhage segmentation on BHSD"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BrainHemorrhageAI Contributors" }]
dependencies = [
    "nibabel>=5.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "SimpleITK>=2.3",
    "torch>=2.2",
    "monai>=1.3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "requests>=2.31",
    "pydantic>=2.6",
]
nnunet = [
    "nnunetv2>=2.4",
]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "api*",
    "clinical*",
    "dataset*",
    "deployment*",
    "evaluation*",
    "inference*",
    "models*",
    "preprocessing*",
    "training*",
]
